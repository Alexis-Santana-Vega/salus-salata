# nginx en producción: HTTPS obligatorio. Es nginx.conf + TLS, redirección y HSTS.
# Certificado en infra/certs/ (salus.crt y salus.key). Imagen no root: 8080 (http) y 8443 (https).

server {
  listen 8080;
  server_name _;
  server_tokens off;
  # Todo lo que llega por HTTP se manda a HTTPS.
  # Prueba local: 8443. En el servidor real: return 301 https://$host$request_uri;
  return 301 https://$host:8443$request_uri;
}

server {
  listen 8443 ssl;
  http2 on;
  ssl_certificate /etc/nginx/certs/salus.crt;
  ssl_certificate_key /etc/nginx/certs/salus.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  client_max_body_size 1m;

  # Cabeceras de seguridad para la app.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # API: se reenvía al backend por la red interna. La IP real del usuario va
  # en X-Real-IP; el backend solo la acepta si viene de este contenedor.
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    # HSTS lo pone nginx para todo el sitio; se quita el del backend para no duplicarlo.
    proxy_hide_header Strict-Transport-Security;
  }

  # /docs del backend no se expone a través de nginx.
  location /docs { return 404; }

  # Manifest de la PWA con su tipo correcto (nginx no lo trae por defecto).
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    types { }
    add_header Cache-Control "no-cache" always;
  }

  # Archivos con hash en el nombre: caché larga.
  location /assets/ {
    expires 1y;
    # add_header en un location reemplaza los del server: se repiten los necesarios.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control "public, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # SPA: cualquier otra ruta sirve index.html (sin caché, para tomar versiones nuevas).
  location / {
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    try_files $uri $uri/ /index.html;
  }
}
