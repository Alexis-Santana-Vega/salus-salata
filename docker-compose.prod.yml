# Modo producción: se aplica ENCIMA de docker-compose.yml.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Diferencias: solo nginx publica puertos (HTTPS), backend y BD quedan
# internos, sin /docs, cookies Secure, HSTS y logs en JSON.
# Los puertos 8088/8443 son para probar en esta máquina; en el servidor real
# se cambian a 80/443 con BIND_IP=0.0.0.0 y el certificado del dominio en infra/certs/.

services:
  db:
    ports: !reset []

  backend:
    ports: !reset []
    environment:
      APP_ENV: production
      DOCS_ENABLED: "false"
      CORS_ORIGINS: ""
      LOG_LEVEL: info

  frontend:
    ports: !override
      - "${BIND_IP:-127.0.0.1}:${HTTP_PORT:-8088}:8080"
      - "${BIND_IP:-127.0.0.1}:${HTTPS_PORT:-8443}:8443"
    volumes:
      - ./frontend/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/certs:/etc/nginx/certs:ro
