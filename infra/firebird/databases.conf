#
# databases.conf · Alias de bases de datos de Firebird
#
# Un alias es un nombre corto que el servidor traduce a la ruta real del
# archivo .fdb. Los clientes (el backend, isql, DBeaver…) se conectan con
#     host:alias          ej.  db:salus
# en lugar de
#     host:/ruta/real.fdb ej.  db:/var/lib/firebird/data/salus.fdb
#
# Este archivo reemplaza al que trae la imagen firebirdsql/firebird:5.0.4,
# por eso conserva sus entradas originales (security.db es obligatoria).
#

# --- Entrada original de la imagen (obligatoria, no tocar) ---------------
security.db = $(dir_secDb)/security5.fdb
{
	RemoteAccess = false
	DefaultDbCachePages = 256
}

# --- Alias de SALUS ------------------------------------------------------
salus = /var/lib/firebird/data/salus.fdb
