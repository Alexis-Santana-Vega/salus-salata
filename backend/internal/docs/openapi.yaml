openapi: 3.1.0
info:
  title: SALUS API
  version: 0.4.0
  description: |
    API de SALUS para la renta de equipo médico e insumos.

    **Convenciones**
    - Rutas versionadas: `/api/v1/...`, recursos en plural y en español.
    - JSON en `camelCase`. Peticiones y respuestas siempre como objeto.
    - Éxito: `{ "data": ... }`; listados: `{ "data": [...], "meta": { page, pageSize, total } }`.
    - Paginación: `?page=1&pageSize=20` (máximo 100).
    - Error: `{ "error": { code, message, details?, requestId } }` con el código HTTP correcto.
    - Cada respuesta trae la cabecera `X-Request-ID` para rastrearla en el log.

    **Sesión**
    - `POST /auth/login` devuelve el token de acceso (15 min) y deja el refresh en una cookie `httpOnly`.
    - Envía el token como `Authorization: Bearer <token>`.
    - Cuando vence, `POST /auth/refresh` (con la cookie) da uno nuevo y rota la cookie.
servers:
  - url: /api/v1
tags:
  - name: Sistema
    description: Estado del servicio
  - name: Autenticación
    description: Inicio y cierre de sesión
  - name: Usuarios
    description: Administración de usuarios (Sysadmin)
paths:
  /health:
    get:
      tags: [Sistema]
      summary: Estado de la API y de la base de datos
      operationId: getHealth
      responses:
        '200':
          description: La API y la base de datos responden
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Health' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/login:
    post:
      tags: [Autenticación]
      summary: Iniciar sesión con usuario o correo
      description: |
        Responde igual si el usuario no existe o la contraseña es incorrecta.
        Tras 5 intentos fallidos para una cuenta (o 20 desde una IP) en 15 minutos responde 429.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [usuario, contrasena]
              properties:
                usuario: { type: string, maxLength: 254, description: Usuario o correo }
                contrasena: { type: string, maxLength: 128, format: password }
      responses:
        '200': { $ref: '#/components/responses/Sesion' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/refresh:
    post:
      tags: [Autenticación]
      summary: Renovar el token de acceso con la cookie de sesión
      description: Rota la cookie. Si se reutiliza una cookie ya usada, se cierran todas las sesiones de esa familia.
      operationId: refresh
      responses:
        '200': { $ref: '#/components/responses/Sesion' }
        '401': { $ref: '#/components/responses/Error' }

  /auth/logout:
    post:
      tags: [Autenticación]
      summary: Cerrar la sesión de este dispositivo
      operationId: logout
      responses:
        '204': { description: Sesión cerrada (también si ya estaba cerrada) }

  /auth/me:
    get:
      tags: [Autenticación]
      summary: Usuario de la sesión actual
      operationId: me
      security: [{ bearer: [] }]
      responses:
        '200':
          description: Usuario actual
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Usuario' }
        '401': { $ref: '#/components/responses/Error' }

  /auth/contrasena:
    put:
      tags: [Autenticación]
      summary: Cambiar mi contraseña
      description: Cierra las demás sesiones y devuelve una sesión nueva. Mínimo 12 caracteres, sin contener el usuario ni el correo.
      operationId: cambiarContrasena
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contrasenaActual, contrasenaNueva]
              properties:
                contrasenaActual: { type: string, format: password, maxLength: 128 }
                contrasenaNueva: { type: string, format: password, minLength: 12, maxLength: 128 }
      responses:
        '200': { $ref: '#/components/responses/Sesion' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /usuarios:
    get:
      tags: [Usuarios]
      summary: Listar usuarios (solo Sysadmin)
      operationId: listarUsuarios
      security: [{ bearer: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Página de usuarios
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Usuario' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /procedimientos:
    get:
      tags: [Procedimientos]
      summary: Listar procedimientos activos (Sysadmin y Admin)
      operationId: listarProcedimientos
      security: [{ bearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Q'
        - { name: sort, in: query, description: 'nombre, creadoEn; con "-" adelante es descendente', schema: { type: string, default: nombre, example: -nombre } }
      responses:
        '200':
          description: Página de procedimientos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Procedimiento' } }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      tags: [Procedimientos]
      summary: Alta de procedimiento
      operationId: crearProcedimiento
      security: [{ bearer: [] }]
      requestBody: { $ref: '#/components/requestBodies/Procedimiento' }
      responses:
        '201': { $ref: '#/components/responses/Procedimiento' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { description: Ya existe un procedimiento activo con ese nombre (sin importar acentos ni mayúsculas), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/Error' }
  /procedimientos/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Procedimientos]
      summary: Consultar un procedimiento
      operationId: obtenerProcedimiento
      security: [{ bearer: [] }]
      responses:
        '200': { $ref: '#/components/responses/Procedimiento' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [Procedimientos]
      summary: Editar un procedimiento
      operationId: actualizarProcedimiento
      security: [{ bearer: [] }]
      requestBody: { $ref: '#/components/requestBodies/Procedimiento' }
      responses:
        '200': { $ref: '#/components/responses/Procedimiento' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Procedimientos]
      summary: Baja lógica (se conserva para el historial)
      operationId: bajaProcedimiento
      security: [{ bearer: [] }]
      responses:
        '204': { description: Dado de baja }
        '404': { $ref: '#/components/responses/Error' }

  /tecnicos:
    get:
      tags: [Tecnicos]
      summary: Listar tecnicos activos (Sysadmin y Admin)
      operationId: listarTecnicos
      security: [{ bearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Q'
        - { name: sort, in: query, description: 'nombre, puesto, creadoEn; con "-" adelante es descendente', schema: { type: string, default: nombre, example: -nombre } }
      responses:
        '200':
          description: Página de tecnicos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Tecnico' } }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      tags: [Tecnicos]
      summary: Alta de técnico
      operationId: crearTecnico
      security: [{ bearer: [] }]
      requestBody: { $ref: '#/components/requestBodies/Tecnico' }
      responses:
        '201': { $ref: '#/components/responses/Tecnico' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /tecnicos/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Tecnicos]
      summary: Consultar un técnico
      operationId: obtenerTecnico
      security: [{ bearer: [] }]
      responses:
        '200': { $ref: '#/components/responses/Tecnico' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [Tecnicos]
      summary: Editar un técnico
      operationId: actualizarTecnico
      security: [{ bearer: [] }]
      requestBody: { $ref: '#/components/requestBodies/Tecnico' }
      responses:
        '200': { $ref: '#/components/responses/Tecnico' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Tecnicos]
      summary: Baja lógica (se conserva para el historial)
      operationId: bajaTecnico
      security: [{ bearer: [] }]
      responses:
        '204': { description: Dado de baja }
        '404': { $ref: '#/components/responses/Error' }

  /doctores:
    get:
      tags: [Doctores]
      summary: Listar doctores activos (Sysadmin y Admin)
      operationId: listarDoctores
      security: [{ bearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Q'
        - { name: sort, in: query, description: 'nombre, numero, correo, municipio, creadoEn; con "-" adelante es descendente', schema: { type: string, default: nombre, example: -nombre } }
      responses:
        '200':
          description: Página de doctores
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Doctor' } }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      tags: [Doctores]
      summary: Alta de doctor
      operationId: crearDoctor
      security: [{ bearer: [] }]
      requestBody: { $ref: '#/components/requestBodies/Doctor' }
      responses:
        '201': { $ref: '#/components/responses/Doctor' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '409': { description: Número o correo ya registrados (details indica el campo), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /doctores/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Doctores]
      summary: Consultar un doctor
      operationId: obtenerDoctor
      security: [{ bearer: [] }]
      responses:
        '200': { $ref: '#/components/responses/Doctor' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [Doctores]
      summary: Editar un doctor
      operationId: actualizarDoctor
      security: [{ bearer: [] }]
      requestBody: { $ref: '#/components/requestBodies/Doctor' }
      responses:
        '200': { $ref: '#/components/responses/Doctor' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Doctores]
      summary: Baja lógica (se conserva para el historial)
      operationId: bajaDoctor
      security: [{ bearer: [] }]
      responses:
        '204': { description: Dado de baja }
        '404': { $ref: '#/components/responses/Error' }

  /hospitales:
    get:
      tags: [Hospitales]
      summary: Listar hospitales activos (Sysadmin y Admin)
      operationId: listarHospitales
      security: [{ bearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Q'
        - { name: sort, in: query, description: 'clave, nombre, municipio, creadoEn; con "-" adelante es descendente', schema: { type: string, default: nombre, example: -nombre } }
      responses:
        '200':
          description: Página de hospitales
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Hospital' } }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      tags: [Hospitales]
      summary: Alta de hospital
      operationId: crearHospital
      security: [{ bearer: [] }]
      requestBody: { $ref: '#/components/requestBodies/Hospital' }
      responses:
        '201': { $ref: '#/components/responses/Hospital' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '409': { description: Clave ya registrada (aunque el hospital esté dado de baja), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /hospitales/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Hospitales]
      summary: Consultar un hospital
      operationId: obtenerHospital
      security: [{ bearer: [] }]
      responses:
        '200': { $ref: '#/components/responses/Hospital' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [Hospitales]
      summary: Editar un hospital
      operationId: actualizarHospital
      security: [{ bearer: [] }]
      requestBody: { $ref: '#/components/requestBodies/Hospital' }
      responses:
        '200': { $ref: '#/components/responses/Hospital' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Hospitales]
      summary: Baja lógica (se conserva para el historial)
      operationId: bajaHospital
      security: [{ bearer: [] }]
      responses:
        '204': { description: Dado de baja }
        '404': { $ref: '#/components/responses/Error' }


  /insumos:
    get:
      tags: [Insumos]
      summary: Listar insumos activos (busca por clave, descripción o código de barras)
      operationId: listarInsumos
      security: [{ bearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Q'
        - { name: sort, in: query, description: 'clave, descripcion, precio, stockActual, stockMinimo, creadoEn; con "-" adelante es descendente', schema: { type: string, default: clave, example: -precio } }
      responses:
        '200':
          description: Página de insumos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Insumo' } }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      tags: [Insumos]
      summary: Alta de insumo
      operationId: crearInsumo
      security: [{ bearer: [] }]
      requestBody: { $ref: '#/components/requestBodies/Insumo' }
      responses:
        '201': { $ref: '#/components/responses/Insumo' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { description: Clave ya usada por un equipo o insumo (aunque esté dado de baja) o código de barras repetido, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/Error' }
  /insumos/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Insumos]
      summary: Consultar un insumo
      operationId: obtenerInsumo
      security: [{ bearer: [] }]
      responses:
        '200': { $ref: '#/components/responses/Insumo' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [Insumos]
      summary: Editar un insumo
      operationId: actualizarInsumo
      security: [{ bearer: [] }]
      requestBody: { $ref: '#/components/requestBodies/Insumo' }
      responses:
        '200': { $ref: '#/components/responses/Insumo' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Insumos]
      summary: Baja lógica (se conserva para el historial)
      operationId: bajaInsumo
      security: [{ bearer: [] }]
      responses:
        '204': { description: Dado de baja }
        '404': { $ref: '#/components/responses/Error' }


  /codigos-postales/{cp}:
    get:
      tags: [Direcciones]
      summary: Colonias de un código postal con su municipio y estado (catálogo SEPOMEX/INEGI)
      operationId: coloniasPorCP
      security: [{ bearer: [] }]
      parameters:
        - { name: cp, in: path, required: true, schema: { type: string, pattern: "^[0-9]{5}$" } }
      responses:
        '200':
          description: Colonias del C.P.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      cp: { type: string }
                      asentamientos: { type: array, items: { $ref: "#/components/schemas/Asentamiento" } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { description: El C.P. no está en el catálogo, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/Error' }
components:
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    Q: { name: q, in: query, description: Contiene el texto, sin importar acentos ni mayúsculas, schema: { type: string, maxLength: 100 } }
  requestBodies:
    Insumo:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [clave, descripcion, unidad, precio, stockActual, stockMinimo]
            properties:
              clave: { type: string, maxLength: 30, example: SON-3-18, description: "Única entre equipos e insumos; se guarda en mayúsculas" }
              descripcion: { type: string, maxLength: 200 }
              unidad: { type: string, enum: [PIEZA, CAJA, PAQUETE] }
              precio: { type: number, minimum: 0, multipleOf: 0.01 }
              codigoBarras: { type: string, maxLength: 64 }
              stockActual: { type: integer, minimum: 0 }
              stockMinimo: { type: integer, minimum: 0 }
    Hospital:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [clave, nombre, direccion]
            properties:
              clave: { type: string, example: HGO-001, description: "Prefijo = estado de la colonia; 3 o 4 dígitos; se guarda en mayúsculas; no se reusa" }
              nombre: { type: string, maxLength: 150 }
              telefono: { type: string, maxLength: 20 }
              direccion: { $ref: "#/components/schemas/Direccion", description: "calle y asentamientoId obligatorios" }
              latitud: { type: [number, "null"], minimum: -90, maximum: 90 }
              longitud: { type: [number, "null"], minimum: -180, maximum: 180 }
              ligaMapa: { type: string, maxLength: 500, pattern: "^https://" }
              contactos: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/Contacto" } }
    Doctor:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [nombre, correo]
            properties:
              nombre: { type: string, maxLength: 120, example: Dr. Aguayo }
              correo: { type: string, format: email, description: "Único entre los activos; se guarda en minúsculas" }
              telPersonal: { type: string, maxLength: 20 }
              telConsultorio: { type: string, maxLength: 20 }
              direccion: { $ref: "#/components/schemas/Direccion" }
    Tecnico:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [nombre, puesto]
            properties:
              nombre: { type: string, maxLength: 120, example: Rodrigo }
              puesto: { $ref: "#/components/schemas/Puesto" }
              telefono: { type: string, maxLength: 20, example: "+52 477 123 4567" }
    Procedimiento:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [nombre]
            properties:
              nombre: { type: string, maxLength: 120, example: Holep }
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Insumo:
      type: object
      properties:
        id: { type: string, format: uuid }
        clave: { type: string }
        descripcion: { type: string }
        unidad: { type: string, enum: [PIEZA, CAJA, PAQUETE] }
        precio: { type: number }
        codigoBarras: { type: string }
        stockActual: { type: integer }
        stockMinimo: { type: integer }
        bajoMinimo: { type: boolean }
        creadoEn: { type: string, format: date-time }
        actualizadoEn: { type: string, format: date-time }
    Contacto:
      type: object
      required: [nombre]
      properties:
        nombre: { type: string, maxLength: 120 }
        puesto: { type: string, maxLength: 60 }
        telefono: { type: string, maxLength: 20 }
    Hospital:
      type: object
      properties:
        id: { type: string, format: uuid }
        clave: { type: string }
        nombre: { type: string }
        telefono: { type: string }
        direccion: { $ref: "#/components/schemas/Direccion" }
        latitud: { type: [number, "null"] }
        longitud: { type: [number, "null"] }
        ligaMapa: { type: string }
        contactos: { type: array, items: { $ref: "#/components/schemas/Contacto" } }
        creadoEn: { type: string, format: date-time }
        actualizadoEn: { type: string, format: date-time }
    Direccion:
      type: object
      description: "Dirección de México. Se envían calle, números y asentamientoId (colonia del catálogo); cp, colonia, municipio, estado y estadoNombre son solo de lectura."
      properties:
        calle: { type: string, maxLength: 120 }
        numExterior: { type: string, maxLength: 20 }
        numInterior: { type: string, maxLength: 20 }
        asentamientoId: { type: [string, "null"], format: uuid, description: "Id de la colonia (GET /codigos-postales/{cp})" }
        cp: { type: string, readOnly: true }
        colonia: { type: string, readOnly: true }
        municipio: { type: string, readOnly: true }
        estado: { type: string, readOnly: true, example: HGO }
        estadoNombre: { type: string, readOnly: true, example: Hidalgo }
    Asentamiento:
      type: object
      properties:
        id: { type: string, format: uuid }
        cp: { type: string, example: "42000" }
        nombre: { type: string, example: Centro }
        tipo: { type: string, example: Colonia }
        zona: { type: string, example: Urbano }
        ciudad: { type: string }
        municipio: { type: string, example: Pachuca de Soto }
        estado: { type: string, example: HGO }
        estadoNombre: { type: string, example: Hidalgo }
    Doctor:
      type: object
      properties:
        id: { type: string, format: uuid }
        numero: { type: string, readOnly: true, example: DOC-0001, description: "Número interno; lo genera el sistema" }
        nombre: { type: string }
        correo: { type: string, format: email }
        telPersonal: { type: string }
        telConsultorio: { type: string }
        direccion: { $ref: "#/components/schemas/Direccion" }
        creadoEn: { type: string, format: date-time }
        actualizadoEn: { type: string, format: date-time }
    Puesto:
      type: string
      enum: [AYUDANTE, ENFERMERIA, ANESTESIOLOGIA, LOGISTICA, OTRO]
    Tecnico:
      type: object
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string, example: Rodrigo }
        puesto: { $ref: "#/components/schemas/Puesto" }
        telefono: { type: string, description: Vacío si no se capturó }
        creadoEn: { type: string, format: date-time }
        actualizadoEn: { type: string, format: date-time }
    Procedimiento:
      type: object
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string, example: Holep }
        creadoEn: { type: string, format: date-time }
        actualizadoEn: { type: string, format: date-time }
    Health:
      type: object
      required: [status, database, version, time]
      properties:
        status: { type: string, example: ok }
        database: { type: string, example: ok }
        version: { type: string, example: 0.4.0 }
        time: { type: string, format: date-time }
    Usuario:
      type: object
      properties:
        id: { type: string, format: uuid }
        usuario: { type: string, example: admin }
        correo: { type: string, format: email }
        nombre: { type: string }
        rol: { type: string, enum: [SYSADMIN, ADMIN, DOCTOR] }
        activo: { type: boolean }
        debeCambiarContrasena: { type: boolean }
        ultimoAcceso: { type: [string, 'null'], format: date-time }
        creadoEn: { type: string, format: date-time }
    Meta:
      type: object
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string, example: contrasenaNueva }
        message: { type: string, example: Usa al menos 12 caracteres }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                [BAD_REQUEST, VALIDATION_ERROR, UNAUTHORIZED, INVALID_CREDENTIALS, PASSWORD_CHANGE_REQUIRED,
                 FORBIDDEN, NOT_FOUND, METHOD_NOT_ALLOWED, CONFLICT, PAYLOAD_TOO_LARGE,
                 UNSUPPORTED_MEDIA_TYPE, TOO_MANY_REQUESTS, INTERNAL_ERROR, SERVICE_UNAVAILABLE]
            message: { type: string }
            details:
              type: array
              items: { $ref: '#/components/schemas/FieldError' }
            requestId: { type: string }
  responses:
    Insumo:
      description: Insumo
      content:
        application/json:
          schema: { type: object, properties: { data: { $ref: "#/components/schemas/Insumo" } } }
    Hospital:
      description: Hospital
      content:
        application/json:
          schema: { type: object, properties: { data: { $ref: "#/components/schemas/Hospital" } } }
    Doctor:
      description: Doctor
      content:
        application/json:
          schema: { type: object, properties: { data: { $ref: "#/components/schemas/Doctor" } } }
    Tecnico:
      description: Técnico
      content:
        application/json:
          schema: { type: object, properties: { data: { $ref: "#/components/schemas/Tecnico" } } }
    Procedimiento:
      description: Procedimiento
      content:
        application/json:
          schema: { type: object, properties: { data: { $ref: "#/components/schemas/Procedimiento" } } }
    Sesion:
      description: Sesión iniciada. El refresh viaja en la cookie `salus_refresh` (httpOnly, SameSite=Strict).
      headers:
        Set-Cookie: { schema: { type: string } }
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  accessToken: { type: string }
                  tokenType: { type: string, example: Bearer }
                  expiresIn: { type: integer, example: 900 }
                  usuario: { $ref: '#/components/schemas/Usuario' }
    Error:
      description: Error con el formato único
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServiceUnavailable:
      description: Un servicio necesario (p. ej. la base de datos) no responde
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Se superó un límite de peticiones o de intentos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
