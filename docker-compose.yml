# Nombre del proyecto por defecto (entorno de pruebas). Producción usa "salus-prod":
# ver scripts/entorno.sh y docs/10-entornos.md.
name: salus-pruebas

services:
  db:
    image: firebirdsql/firebird:5.0.4
    restart: unless-stopped
    environment:
      TZ: America/Mexico_City
      FIREBIRD_ROOT_PASSWORD: ${FIREBIRD_ROOT_PASSWORD:?Falta FIREBIRD_ROOT_PASSWORD en .env}
      FIREBIRD_USER: ${FIREBIRD_USER:?Falta FIREBIRD_USER en .env}
      FIREBIRD_PASSWORD: ${FIREBIRD_PASSWORD:?Falta FIREBIRD_PASSWORD en .env}
      # Archivo físico que se crea la primera vez (dentro del volumen).
      FIREBIRD_DATABASE: salus.fdb
      FIREBIRD_DATABASE_DEFAULT_CHARSET: UTF8
      # Endurecimiento: solo se pueden abrir bases dentro del volumen de datos.
      # (Por defecto "Full" permite abrir cualquier ruta del contenedor.)
      FIREBIRD_CONF_DatabaseAccess: Restrict /var/lib/firebird/data
      # Explícitos aunque ya son el valor por defecto en Firebird 5:
      FIREBIRD_CONF_AuthServer: Srp256
      FIREBIRD_CONF_WireCrypt: Required
    volumes:
      - salus-db-data:/var/lib/firebird/data
      # Nuestro databases.conf con el alias "salus" reemplaza al de la imagen.
      - ./infra/firebird/databases.conf:/opt/firebird/databases.conf:ro
    ports:
      # Solo accesible desde esta máquina (para isql/DBeaver en desarrollo).
      - "127.0.0.1:${FIREBIRD_PORT:-3050}:3050"
    networks:
      - salus
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/3050'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./backend
      args:
        VERSION: 0.6.0
    image: salus-backend:0.6.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: America/Mexico_City
      APP_ENV: ${APP_ENV:-development}
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DOCS_ENABLED: ${DOCS_ENABLED:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Dentro de la red de compose la BD se llama "db" y se entra por el alias.
      FIREBIRD_HOST: db
      FIREBIRD_PORT: "3050"
      FIREBIRD_DB_ALIAS: ${FIREBIRD_DB_ALIAS:?Falta FIREBIRD_DB_ALIAS en .env}
      FIREBIRD_USER: ${FIREBIRD_USER}
      FIREBIRD_PASSWORD: ${FIREBIRD_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en .env}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-168h}
      INITIAL_ADMIN_USUARIO: ${INITIAL_ADMIN_USUARIO:-}
      INITIAL_ADMIN_CORREO: ${INITIAL_ADMIN_CORREO:-}
      INITIAL_ADMIN_NOMBRE: ${INITIAL_ADMIN_NOMBRE:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      # Solo se confía en X-Real-IP si la petición viene de nginx (IP fija abajo).
      TRUSTED_PROXIES: ${NGINX_IP:-172.28.0.10}
    ports:
      # Solo desarrollo (curl, Scalar). En producción se quita: se entra por nginx.
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    networks:
      - salus

  frontend:
    build:
      context: ./frontend
    image: salus-frontend:0.6.0
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Puerta única de la app. En producción: 80/443 público con TLS.
      - "127.0.0.1:${FRONTEND_PORT:-8081}:8080"
    networks:
      salus:
        ipv4_address: ${NGINX_IP:-172.28.0.10}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

# Red interna con rango fijo para fijar la IP de nginx (proxy de confianza).
networks:
  salus:
    ipam:
      config:
        - subnet: ${SALUS_SUBNET:-172.28.0.0/24}

volumes:
  salus-db-data:
