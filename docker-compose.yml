name: salus

services:
  db:
    image: firebirdsql/firebird:5.0.4
    container_name: salus-db
    restart: unless-stopped
    environment:
      TZ: America/Mexico_City
      FIREBIRD_ROOT_PASSWORD: ${FIREBIRD_ROOT_PASSWORD:?Falta FIREBIRD_ROOT_PASSWORD en .env}
      FIREBIRD_USER: ${FIREBIRD_USER:?Falta FIREBIRD_USER en .env}
      FIREBIRD_PASSWORD: ${FIREBIRD_PASSWORD:?Falta FIREBIRD_PASSWORD en .env}
      # Archivo físico que se crea la primera vez (dentro del volumen).
      FIREBIRD_DATABASE: salus.fdb
      FIREBIRD_DATABASE_DEFAULT_CHARSET: UTF8
    volumes:
      - salus-db-data:/var/lib/firebird/data
      # Nuestro databases.conf con el alias "salus" reemplaza al de la imagen.
      - ./infra/firebird/databases.conf:/opt/firebird/databases.conf:ro
    ports:
      # Solo accesible desde esta máquina (para isql/DBeaver en desarrollo).
      - "127.0.0.1:${FIREBIRD_PORT:-3050}:3050"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/3050'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  salus-db-data:
